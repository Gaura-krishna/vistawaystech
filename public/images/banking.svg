<radialGradient id="g2" cx="0.85" cy="0.95" r="0.7"><stop offset="0" stop-color="#7a3ae6" stop-opacity=".5"/><stop offset="1" stop-color="#7a3ae6" stop-opacity="0"/></radialGradient>
